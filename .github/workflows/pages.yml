name: Pages

# Deploys site/ to GitHub Pages on push to main only.
# The repository Pages source must be "GitHub Actions" (owner confirms that setting).
# Pull request branches do not deploy.
# The deploy publishes the committed site/dashboard.json as-is (the real
# league since 0.5.10); dashboard updates land through pull requests, never
# by regenerating data during the deploy.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
