[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-lab"
version = "0.5.2"
description = "Fantasy-football analytics for the Yahoo league Fantasy Football Coalition."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.4.1",
    "lightgbm==4.6.0",
    "pyarrow==21.0.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
gridiron-lab = "gridiron_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["gridiron_lab"]

[tool.ruff.format]
docstring-code-format = true
