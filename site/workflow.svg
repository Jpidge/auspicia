<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="656" fill="#16181a"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2EE6A8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
  </defs>

  <!-- INPUTS -->
  <g>
    <rect x="8" y="8" width="180" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="98" y="30" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#F2F3F4">NFLVERSE</text>
    <text x="98" y="48" text-anchor="middle" font-size="10" fill="#9AA0A6">play-by-play · stats · schedules</text>

    <rect x="196" y="8" width="180" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="286" y="30" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#F2F3F4">YAHOO</text>
    <text x="286" y="48" text-anchor="middle" font-size="10" fill="#9AA0A6">league rosters · Yahoo projections</text>

    <rect x="384" y="8" width="180" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="474" y="30" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#F2F3F4">VEGAS LINES</text>
    <text x="474" y="48" text-anchor="middle" font-size="10" fill="#9AA0A6">spreads · totals · team totals</text>

    <rect x="572" y="8" width="180" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="662" y="30" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#F2F3F4">PRACTICE REPORTS</text>
    <text x="662" y="48" text-anchor="middle" font-size="10" fill="#9AA0A6">injury reports · FP / LP / DNP</text>
  </g>
  <line x1="98" y1="64" x2="98" y2="140" stroke="#9AA0A6" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="286" y1="64" x2="286" y2="86" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="474" y1="64" x2="474" y2="86" stroke="#9AA0A6" stroke-width="1.5"/>

  <!-- ENGINE ZONE -->
  <rect x="8" y="88" width="470" height="524" rx="12" fill="#26282c" stroke="#2EE6A8" stroke-dasharray="6 4"/>
  <text x="24" y="114" font-size="15" font-weight="bold" fill="#2EE6A8">THE ENGINE</text>
  <text x="150" y="114" font-size="11" fill="#9AA0A6">— sole job: make the projections better</text>

  <!-- chain boxes -->
  <g font-size="10.5" fill="#9AA0A6">
    <rect x="28" y="142" width="264" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="40" y="163" font-size="12.5" font-weight="bold" fill="#F2F3F4">1 · INGEST</text>
    <text x="40" y="180"><tspan x="40">Pull raw facts into the store (DuckDB),</tspan><tspan x="40" dy="12">dated and frozen. Nothing learned yet.</tspan></text>

    <rect x="28" y="214" width="264" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="40" y="235" font-size="12.5" font-weight="bold" fill="#F2F3F4">2 · FEATURES</text>
    <text x="40" y="252"><tspan x="40">Facts become signals per player-week:</tspan><tspan x="40" dy="12">form, usage, opponent, Vegas context.</tspan></text>

    <rect x="28" y="286" width="264" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="40" y="307" font-size="12.5" font-weight="bold" fill="#F2F3F4">3 · TRAIN</text>
    <text x="40" y="324"><tspan x="40">LightGBM, one model per position, learns</tspan><tspan x="40" dy="12">signals → points from past seasons.</tspan></text>

    <rect x="28" y="358" width="264" height="56" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="40" y="379" font-size="12.5" font-weight="bold" fill="#F2F3F4">4 · PREDICT</text>
    <text x="40" y="396"><tspan x="40">This week, per player: a distribution —</tspan><tspan x="40" dy="12">mean + q10 / q50 / q90, your league's scoring.</tspan></text>

    <rect x="28" y="430" width="264" height="40" rx="8" fill="#1e2023" stroke="#2EE6A8"/>
    <text x="40" y="447" font-size="12" font-weight="bold" fill="#F2F3F4">EXPORT → dashboard.json</text>
    <text x="40" y="462" font-size="10">one frozen file of this week's numbers</text>

    <rect x="28" y="486" width="264" height="52" rx="8" fill="#1e2023" stroke="#2e3136"/>
    <text x="40" y="506" font-size="12.5" font-weight="bold" fill="#F2F3F4">5 · EVALUATE</text>
    <text x="40" y="522"><tspan x="40">Replays 2022–25 (72 rounds, past-only)</tspan><tspan x="40" dy="12">and grades live weeks vs actuals + Yahoo.</tspan></text>

    <rect x="28" y="554" width="264" height="52" rx="8" fill="#1e2023" stroke="#F59E0B"/>
    <text x="40" y="574" font-size="12.5" font-weight="bold" fill="#F59E0B">6 · PROMOTION GATES</text>
    <text x="40" y="590"><tspan x="40">5 pass/fail checks — ALL must pass.</tspan><tspan x="40" dy="12">Fail → diagnose, one written fix, re-test.</tspan></text>
  </g>

  <!-- chain arrows -->
  <g stroke="#2EE6A8" stroke-width="1.5">
    <line x1="160" y1="198" x2="160" y2="212" marker-end="url(#arr)"/>
    <line x1="160" y1="270" x2="160" y2="284" marker-end="url(#arr)"/>
    <line x1="160" y1="342" x2="160" y2="356" marker-end="url(#arr)"/>
    <line x1="160" y1="414" x2="160" y2="428" marker-end="url(#arr)"/>
    <line x1="160" y1="470" x2="160" y2="484" marker-end="url(#arr)"/>
    <line x1="160" y1="538" x2="160" y2="552" marker-end="url(#arr)"/>
  </g>

  <!-- improvement loop -->
  <path d="M292,580 H452 V314 H294" fill="none" stroke="#2EE6A8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="446" y="447" font-size="10.5" fill="#2EE6A8" transform="rotate(-90 446 447)" text-anchor="middle">diagnose → written fix → re-test</text>

  <!-- DASHBOARD ZONE -->
  <rect x="494" y="88" width="258" height="180" rx="12" fill="#26282c" stroke="#2EE6A8"/>
  <text x="510" y="114" font-size="14" font-weight="bold" fill="#F2F3F4">THE DASHBOARD</text>
  <text x="510" y="132" font-size="11" fill="#9AA0A6">the product — numbers only</text>
  <g font-size="11.5" fill="#F2F3F4">
    <text x="510" y="162">• Start / sit verdicts (by mean)</text>
    <text x="510" y="186">• Projected totals, win probability</text>
    <text x="510" y="210">• Four clean tabs</text>
    <text x="510" y="234">• No explanations, no engine talk</text>
  </g>
  <path d="M292,450 H470 V160 H492" fill="none" stroke="#2EE6A8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CONTROL CENTER ZONE -->
  <rect x="494" y="292" width="258" height="180" rx="12" fill="#26282c" stroke="#219EBC" stroke-dasharray="6 4"/>
  <text x="510" y="318" font-size="14" font-weight="bold" fill="#F2F3F4">CONTROL CENTER</text>
  <text x="510" y="336" font-size="11" fill="#9AA0A6">the manual — reads reports only</text>
  <g font-size="11.5" fill="#F2F3F4">
    <text x="510" y="366">• How every engine feature works</text>
    <text x="510" y="390">• Milestones and progress, bulleted</text>
    <text x="510" y="414">• Benchmarks: MAE, coverage, bias</text>
    <text x="510" y="438">• Gate status + weekly scorecards</text>
  </g>
  <path d="M292,512 H470 V382 H492" fill="none" stroke="#219EBC" stroke-width="1.5"/>

  <text x="380" y="640" text-anchor="middle" font-size="11" fill="#9AA0A6">Arrows = data flow. The dashboard and control center only READ — nothing writes back into the engine.</text>
</svg>
