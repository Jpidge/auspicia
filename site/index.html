<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gridiron Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="logo" aria-hidden="true">GL</span><span>Gridiron<span class="full"> Lab</span></span></div>
      <span class="badge hdr-badge" id="example-badge" hidden>● Example data</span>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button role="tab" id="t-team" aria-controls="v-team" aria-selected="true" data-v="team">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          Team
        </button>
        <button role="tab" id="t-waivers" aria-controls="v-waivers" aria-selected="false" tabindex="-1" data-v="waivers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Waivers
        </button>
        <button role="tab" id="t-league" aria-controls="v-league" aria-selected="false" tabindex="-1" data-v="league">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          League
        </button>
        <button role="tab" id="t-lab" aria-controls="v-lab" aria-selected="false" tabindex="-1" data-v="lab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7 15h10"/></svg>
          Lab
        </button>
      </nav>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch to light theme">
        <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </div>
  </header>
  <main>
    <p class="sub" id="status" role="status">Loading dashboard…</p>
    <section class="view on" id="v-team" role="tabpanel" aria-labelledby="t-team" hidden>
      <div class="hero">
        <div>
          <div class="sub" id="league-line"></div>
          <h1 id="team-title"></h1>
          <label class="team-pick" for="team-select">Team
            <select id="team-select"></select>
          </label>
        </div>
        <div class="kick" id="kickoff">
          <span class="sub">Next kickoff</span>
          <b class="num" id="countdown"></b>
          <span class="sub" id="kickoff-label"></span>
        </div>
      </div>
      <p class="note" id="team-note" role="status" hidden></p>
      <div class="cols">
        <div class="main-col">
          <div class="card matchup" id="matchup" aria-label="Matchup projection"></div>
          <div class="lineup-col" id="lineup-col"></div>
        </div>
        <div class="side-col">
          <div class="card tough" id="tough-card"></div>
          <div class="card legend-card" id="legend-card"></div>
        </div>
      </div>
    </section>
    <section class="view" id="v-waivers" role="tabpanel" aria-labelledby="t-waivers" hidden>
      <div class="hero"><div><div class="sub" id="waiver-sub"></div><h1>Top pickups</h1></div></div>
      <div class="pills-wrap">
        <div class="pills" role="group" aria-label="Filter by position" id="pills"></div>
      </div>
      <div class="wgrid" id="wlist"></div>
    </section>
    <section class="view" id="v-league" role="tabpanel" aria-labelledby="t-league" hidden>
      <div class="hero"><div><div class="sub" id="league-sub"></div><h1>League</h1></div></div>
      <div class="card table-card">
        <table class="tbl" id="ltbl">
          <caption class="sr">Teams by projected total. Activate a column header to sort.</caption>
          <thead>
            <tr>
              <th scope="col" data-k="rank"><button type="button">#</button></th>
              <th scope="col" data-k="name"><button type="button">Team</button></th>
              <th scope="col" data-k="wins" class="hide-s"><button type="button">Record</button></th>
              <th scope="col" data-k="opponent_name" class="hide-s"><button type="button">Opponent</button></th>
              <th scope="col" data-k="projected_total" class="r" aria-sort="descending"><button type="button">Proj</button></th>
              <th scope="col" class="hide-s bar-col"><span class="sr">Share of leader</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <section class="view" id="v-lab" role="tabpanel" aria-labelledby="t-lab" hidden>
      <div class="hero"><div><div class="sub">Model validation</div><h1>Lab</h1></div></div>
      <div id="lab-root"></div>
    </section>
  </main>
  <footer>
    <span class="badge" id="footer-badge" hidden>● Example data</span>
    <span id="footer-text"></span>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
